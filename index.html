<!doctype html>
<html lang="en" data-theme="day">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0, viewport-fit=cover"
    />
    <meta name="theme-color" content="#e8e3d8" />
    <title>Mohamed Arfaoui Portfolio</title>
    <meta
      name="description"
      content="Mohamed Arfaoui. Software and full-stack development, BUT Informatique at IUT Annecy. Selected work, skills and experience."
    />
    <meta property="og:title" content="Mohamed Arfaoui Portfolio" />
    <meta
      property="og:description"
      content="Software, applications and a path through computer science. A spatial portfolio from Annecy, France."
    />
    <meta property="og:type" content="website" />
    <meta property="og:url" content="https://arfaoumo.github.io/" />
    <link rel="canonical" href="https://arfaoumo.github.io/" />
    <link rel="icon" href="/assets/favicon.ico" />
    <script>
      try {
        var t = localStorage.getItem("portfolio-theme");
        document.documentElement.dataset.theme =
          t === "day" || t === "night"
            ? t
            : matchMedia("(prefers-color-scheme: dark)").matches
              ? "night"
              : "day";
      } catch {}
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
